<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Distribució · Aixovall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: drafting-table app. Tool rail left, sheet in the middle, inspector right; on phones the inspector becomes a bottom sheet. */
:root{
  --paper:#EBEFEE; --panel:#FAFBFB; --panel2:#F1F4F3; --ink:#172126; --mute:#5D6B71; --line:#D2D9DA;
  --wall:#172126; --wint:#8E999E; --room:#FFFFFF; --roomOn:#DCE5FF; --furn:#FFFFFF; --furn2:#E4E9EA;
  --accent:#2448C8; --accentSoft:#E3E9FF; --onAccent:#FFFFFF; --lock:#A8620A; --lockSoft:#FBEFD9; --danger:#B42318;
  --grid:rgba(23,33,38,.06); --gridM:rgba(23,33,38,.12);
  --ui:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 8px 28px rgba(16,24,28,.16);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101517; --panel:#171D20; --panel2:#1E2528; --ink:#DDE5E8; --mute:#93A1A7; --line:#2D373B;
  --wall:#DDE5E8; --wint:#69767C; --room:#182024; --roomOn:#22305C; --furn:#1E272B; --furn2:#2A3438;
  --accent:#86A2FF; --accentSoft:#1F2A4F; --onAccent:#0D1430; --lock:#F0A93E; --lockSoft:#3A2B12; --danger:#FF8A7A;
  --grid:rgba(221,229,232,.05); --gridM:rgba(221,229,232,.1); --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101517; --panel:#171D20; --panel2:#1E2528; --ink:#DDE5E8; --mute:#93A1A7; --line:#2D373B;
  --wall:#DDE5E8; --wint:#69767C; --room:#182024; --roomOn:#22305C; --furn:#1E272B; --furn2:#2A3438;
  --accent:#86A2FF; --accentSoft:#1F2A4F; --onAccent:#0D1430; --lock:#F0A93E; --lockSoft:#3A2B12; --danger:#FF8A7A;
  --grid:rgba(221,229,232,.05); --gridM:rgba(221,229,232,.1); --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:14px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-columns:66px minmax(0,1fr) 330px;grid-template-rows:50px minmax(0,1fr);grid-template-areas:"top top top" "tools stage panel"}
/* top bar */
.top{grid-area:top;display:flex;align-items:center;gap:10px;padding-inline:12px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand svg{width:22px;height:22px}
.pname{min-width:0;flex:1 1 auto;max-width:280px;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 8px;font-weight:500}
.pname:hover,.pname:focus{border-color:var(--line);background:var(--panel2);outline:none}
.chip{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:99px;background:var(--lockSoft);color:var(--lock);white-space:nowrap}
.sp{flex:1}
.tb{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:7px;border:1px solid var(--line);background:var(--panel);cursor:pointer;white-space:nowrap}
.tb:hover{background:var(--panel2)}
.tb:focus-visible,.tool:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tb.pri{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.tb.pri:hover{filter:brightness(1.08)}
.tb svg{width:16px;height:16px}
.tb.ico{padding:0;width:32px;justify-content:center}
.tb:disabled{opacity:.4;cursor:default}
/* tool rail */
.tools{grid-area:tools;display:flex;flex-direction:column;align-items:center;gap:2px;padding-block:8px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden}
.tool{width:58px;min-height:46px;flex:none;border-radius:8px;border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;position:relative;padding:4px 2px;font-size:10.5px;line-height:1.05;color:var(--ink)}
.tool .t{white-space:nowrap}
.tool svg{width:20px;height:20px}
.tool:hover{background:var(--panel2)}
.tool.on{background:var(--accentSoft);border-color:var(--accent);color:var(--accent)}
.tool .k{position:absolute;right:4px;top:2px;font-family:var(--mono);font-size:8.5px;color:var(--mute)}
.rsep{width:24px;height:1px;background:var(--line);margin:4px 0}
/* stage */
.stage{grid-area:stage;position:relative;overflow:hidden;min-width:0;min-height:0}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--paper)}
#cv.pan{cursor:grab} #cv.cross{cursor:crosshair}
.hud{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:calc(100% - 200px)}
.hint{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;box-shadow:var(--shadow);pointer-events:none}
.coords{font-family:var(--mono);font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:8px}
.zbox{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}
.zbox button{width:32px;height:30px;border:0;background:transparent;cursor:pointer;font-size:16px}
.zbox button:hover{background:var(--panel2)}
.zbox span{font-family:var(--mono);font-size:11px;display:grid;place-items:center;min-width:46px;border-inline:1px solid var(--line)}
.sbar{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;box-shadow:var(--shadow);font-family:var(--mono);font-size:10.5px;display:flex;flex-direction:column;gap:3px}
.sbar i{display:block;height:5px;border:1px solid var(--ink);border-top:0}
.lenbox{position:absolute;pointer-events:none;background:var(--accent);color:var(--onAccent);font-family:var(--mono);font-size:12px;padding:3px 7px;border-radius:5px}
/* panel */
.panel{grid-area:panel;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);padding-inline:8px;gap:2px}
.tab{flex:1;border:0;background:transparent;padding:12px 6px 10px;cursor:pointer;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:6px}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .ai{font-family:var(--mono);font-size:10px;background:var(--accent);color:var(--onAccent);border-radius:4px;padding:1px 4px}
.pbody{overflow:auto;flex:1;padding:14px 16px 24px;display:flex;flex-direction:column;gap:16px;min-height:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h4{margin:0;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:600}
.sec h3{margin:0;font-size:18px;font-weight:600;text-wrap:balance}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:11.5px;color:var(--mute)}
.inp{height:32px;border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:0 9px;width:100%;min-width:0}
.inp.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px}
.inp:disabled{opacity:.55}
textarea.inp{height:auto;min-height:84px;padding:8px 9px;resize:vertical;line-height:1.4}
.btn{height:32px;padding:0 11px;border-radius:7px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--panel2)} .btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
.btn.dng{color:var(--danger)}
.btn.full{width:100%;justify-content:center}
.btn svg{width:15px;height:15px}
.note{font-size:12.5px;color:var(--mute);line-height:1.45;margin:0}
.lockbar{display:flex;gap:8px;align-items:flex-start;background:var(--lockSoft);color:var(--lock);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.4}
.lockbar svg{flex:none;width:16px;height:16px;margin-top:1px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;padding:3px 0}
.sw input{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--panel);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw input:checked{background:var(--accent)} .sw input:checked::after{transform:translateX(14px)}
.sw input.lk:checked{background:var(--lock)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stats div{background:var(--panel);padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.stats b{font-family:var(--mono);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.stats span{font-size:11.5px;color:var(--mute)}
.rlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rlist button{display:flex;justify-content:space-between;gap:8px;border:0;border-bottom:1px solid var(--line);background:var(--panel);padding:7px 10px;cursor:pointer;text-align:left}
.rlist button:last-child{border-bottom:0}
.rlist button:hover{background:var(--panel2)}
.rlist .m{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--mute)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:26px;height:8px;border:1px solid var(--ink);display:inline-block}
/* library */
.libgrp{display:flex;flex-direction:column;gap:8px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.li{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:6px 4px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.li:hover{border-color:var(--accent)}
.li.on{border-color:var(--accent);background:var(--accentSoft)}
.li svg{width:62px;height:46px}
.li b{font-weight:500;font-size:12px;line-height:1.15}
.li span{font-family:var(--mono);font-size:10px;color:var(--mute)}
/* AI */
.drops{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.drop{border:1.5px dashed var(--line);border-radius:9px;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;cursor:pointer;text-align:center;background:var(--panel2);position:relative;overflow:hidden}
.drop:hover,.drop.over{border-color:var(--accent)}
.drop b{font-size:12.5px;font-weight:600} .drop span{font-size:11px;color:var(--mute)}
.drop img{max-width:100%;max-height:70px;object-fit:contain;border-radius:4px;background:#fff}
.dwrap{position:relative;min-width:0;display:flex}.dwrap .drop{flex:1;min-width:0}
.dwrap .x{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;line-height:1;font-size:14px;z-index:2}
.drop input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.drop:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.drop svg{width:22px;height:22px;color:var(--mute)}
.drop .n{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.06em}
.pnav{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.pnav .btn{height:26px;padding:0 9px}
.li .gap{fill:var(--panel)}.li.on .gap{fill:var(--accentSoft)}
.stage.over::after{content:"Suelta el PDF o la imagen para importarlo";position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:12px;display:grid;place-items:center;background:var(--accentSoft);opacity:.92;color:var(--accent);font-weight:600;font-size:15px;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.status{font-family:var(--mono);font-size:11.5px;color:var(--accent);display:flex;align-items:center;gap:8px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.status::before{animation:none}}
.log{display:flex;flex-direction:column;gap:8px}
.msg{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.45;display:flex;flex-direction:column;gap:6px}
.msg .q{font-weight:600}
.msg .meta{font-family:var(--mono);font-size:10.5px;color:var(--mute)}
.off{border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12.5px;color:var(--mute);line-height:1.45}
/* menus, modal, toast */
.menu{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:250px;display:flex;flex-direction:column}
.menu button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;background:transparent;padding:7px 10px;border-radius:7px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--panel2)}
.menu button b{font-weight:600}
.menu button span{font-size:11.5px;color:var(--mute)}
#modal{position:fixed;inset:0;z-index:40;background:rgba(10,14,16,.42);display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);width:min(440px,100%);max-height:90%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.mbox h3{margin:0;font-size:18px}
.mbox img{max-width:100%;border:1px solid var(--line);border-radius:6px}
.mact{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;top:62px;transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);max-width:min(90vw,460px);text-align:center}
/* phones */
@media (max-width:760px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:50px minmax(0,1fr) 58px minmax(0,40%);grid-template-areas:"top" "stage" "tools" "panel"}
  .tools{flex-direction:row;padding-inline:8px;padding-block:0;overflow-x:auto;overflow-y:hidden;border-right:0;border-top:1px solid var(--line)}
  .rsep{width:1px;height:24px;margin:0 4px}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .brand span,.tb .lbl{display:none}
  .pname{max-width:none}
  .hud{max-width:calc(100% - 150px)} .zoom .sbar{display:none} .coords{display:none}
  .hint{font-size:11.5px}
}
#bImport,#bExport,.tool[data-act=ai],.tab[data-tab=ai]{display:none!important}
.chip.axcost{background:#fde9da;color:#9a4a10;font-size:12px;padding:4px 10px}
#bApply{background:#e96e1c;border-color:#e96e1c;color:#241b14;font-weight:600}
@media (max-width:760px){#bReset{display:none}.chip.axcost{font-size:11px}}
</style>

    <button class="tb ico" id="bRedo" title="Rehacer (Ctrl+Y)" aria-label="Rehacer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>

  <nav class="tools" id="tools" aria-label="Herramientas">

    <button class="tool" data-tool="open" data-kind="sliding" title="Puerta corredera (C)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 14h3M19 14h3"/><path d="M5 11h10" stroke-width="2.4"/><path d="M12 11h9" stroke-dasharray="2 2"/><path d="M17 7l3 2-3 2"/></svg><span class="t">Corredera</span><span class="k">C</span></button>
    <button class="tool" data-tool="open" data-kind="window" title="Ventana (N)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 9h4v6H2zM18 9h4v6h-4zM6 10.5h12M6 13.5h12"/></svg><span class="t">Ventana</span><span class="k">N</span></button>
    <button class="tool" data-tool="open" data-kind="balcony" title="Balconera, salida a balcón o terraza (B)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 18h3M19 18h3M5 18V9M19 18V9M5 20h14"/><path d="M5 9a7 7 0 0 1 7 7M19 9a7 7 0 0 0-7 7" stroke-dasharray="2 2"/></svg><span class="t">Balconera</span><span class="k">B</span></button>

<script>

/* ================= utilities ================= */

const fmtM=cm=>(cm/100).toFixed(2).replace('.',',');
const fmtA=cm2=>(cm2/10000).toFixed(1).replace('.',',');

let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('No se pudo cargar '+src));document.head.appendChild(s);});}

/* ================= catalogue ================= */
const CAT=[
 {g:'Cocina',items:[['k_base','Módulo bajo',60,60],['k_drawer','Cajonera',40,60],['k_sink','Fregadero',80,60],['k_hob','Placa cocción',60,60],['k_oven','Columna horno',60,60],['k_fridge','Frigorífico',60,65],['k_dish','Lavavajillas',60,60],['k_corner','Módulo rincón',100,60],['k_wall','Mueble alto',60,35],['k_island','Isla',180,90],['k_filler','Remate',15,60]]},
 {g:'Salón',items:[['sofa','Sofá 3 plazas',210,90],['sofa_l','Sofá chaise',260,160],['armchair','Butaca',80,80],['coffee','Mesa de centro',110,60],['tv','Mueble TV',180,45],['shelf','Estantería',100,35],['rug','Alfombra',200,140]]},
 {g:'Comedor',items:[['dining','Mesa 6 pers.',180,90],['dining4','Mesa 4 pers.',120,80],['round','Mesa redonda',110,110],['chair','Silla',45,50]]},
 {g:'Dormitorio',items:[['bed2','Cama 160',160,200],['bed1','Cama 90',90,190],['night','Mesita',45,40],['wardrobe','Armario',180,60],['desk','Escritorio',120,60],['dresser','Cómoda',100,50]]},
 {g:'Baño',items:[['wc','Inodoro',38,65],['basin','Lavabo',60,45],['bath','Bañera hidromasaje',170,75],['shower','Plato ducha',90,90],['bidet','Bidé',38,55],['washer','Lavadora',60,60]]},
 {g:'Instalaciones',items:[['wp_cold','Punto agua fría',26,26],['wp_hot','Punto agua caliente',26,26],['wp_drain','Punto desagüe',26,26]]},

];
const TYPES={};CAT.forEach(g=>g.items.forEach(([k,n,w,d])=>TYPES[k]={name:n,w,d,g:g.g}));

/* ================= symbols (local coords, back side at -d/2) ================= */
function sym(t,w,d){
 const x0=-w/2,y0=-d/2,x1=w/2,y1=d/2,m=Math.min(w,d);
 const R=(x,y,ww,hh,c='fu',rx=0)=>`<rect x="${f1(x)}" y="${f1(y)}" width="${f1(Math.max(ww,.1))}" height="${f1(Math.max(hh,.1))}" rx="${rx}" class="${c}"/>`;
 const L=(a,b,c,e,cl='ln')=>`<line x1="${f1(a)}" y1="${f1(b)}" x2="${f1(c)}" y2="${f1(e)}" class="${cl}"/>`;
 const C=(x,y,r,c='fu')=>`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" class="${c}"/>`;
 const E=(x,y,rx,ry,c='fu')=>`<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(rx)}" ry="${f1(ry)}" class="${c}"/>`;
 const T=(s,sz)=>`<text x="0" y="${f1(sz*0.35)}" font-size="${f1(sz)}" text-anchor="middle" class="tm">${s}</text>`;
 let o='';
 switch(t){
  case 'k_base': return R(x0,y0,w,d)+L(x0,y1-4,x1,y1-4);
  case 'k_drawer': return R(x0,y0,w,d)+L(x0,y1-4,x1,y1-4)+L(x0+w*.25,y1-9,x1-w*.25,y1-9);
  case 'k_sink': return R(x0,y0,w,d)+R(-w*.36,y0+9,w*.72,d-20,'fu2',6)+C(0,y0+5,2.4,'ln');
  case 'k_hob': {const r=m*.13;return R(x0,y0,w,d)+[[-1,-1],[1,-1],[-1,1],[1,1]].map(([a,b])=>C(a*w/4.2,b*d/4.4,r,'ln')).join('');}
  case 'k_oven': return R(x0,y0,w,d)+L(x0,y0,x1,y1)+L(x1,y0,x0,y1);
  case 'k_fridge': return R(x0,y0,w,d)+L(x0,y0,x1,y1)+T('FR',m*.26);
  case 'k_dish': return R(x0,y0,w,d)+R(x0+5,y0+5,w-10,d-10,'fd')+T('LV',m*.26);
  case 'k_corner': return R(x0,y0,w,d)+L(x0,y1-4,x1,y1-4)+L(x1-d,y0,x1,y1-4,'fd');
  case 'k_wall': return R(x0,y0,w,d,'fd')+L(x0,y0,x1,y1,'fd');
  case 'k_island': return R(x0,y0,w,d,'fu',2)+R(x0+5,y0+5,w-10,d-10,'ln',1);
  case 'k_filler': return R(x0,y0,w,d,'fu2');
  case 'sofa': {o=R(x0,y0,w,d,'fu',6)+R(x0,y0,w,18,'fu2',5)+R(x0,y0,16,d,'fu2',5)+R(x1-16,y0,16,d,'fu2',5);const n=w>170?3:2,sw=(w-32)/n;for(let i=0;i<n;i++)o+=R(x0+16+i*sw+1,y0+19,sw-2,d-21,'fu',3);return o;}
  case 'sofa_l': {const cw=Math.min(90,w*.4),sd=Math.min(90,d);o=`<path d="M${x0} ${y0}H${x1}V${y1}H${x1-cw}V${y0+sd}H${x0}Z" class="fu"/>`;o+=R(x0,y0,w,18,'fu2',5)+R(x0,y0,16,sd,'fu2',5)+R(x1-12,y0,12,d,'fu2',4);o+=R(x1-cw+1,y0+19,cw-14,d-21,'fu',3);const n=2,sw=(w-cw-16)/n;for(let i=0;i<n;i++)o+=R(x0+16+i*sw+1,y0+19,sw-2,sd-21,'fu',3);return o;}
  case 'armchair': return R(x0,y0,w,d,'fu',6)+R(x0,y0,w,16,'fu2',5)+R(x0,y0,14,d,'fu2',5)+R(x1-14,y0,14,d,'fu2',5)+R(x0+15,y0+17,w-30,d-19,'fu',3);
  case 'coffee': return R(x0,y0,w,d,'fu',4)+R(x0+6,y0+6,w-12,d-12,'ln',2);
  case 'tv': return R(x0,y0,w,d)+R(-w*.38,y0+d*.3,w*.76,4,'ink');
  case 'shelf': {o=R(x0,y0,w,d);const n=Math.max(1,Math.round(w/35));for(let i=1;i<n;i++)o+=L(x0+w*i/n,y0,x0+w*i/n,y1);return o;}
  case 'rug': return R(x0,y0,w,d,'fd')+R(x0+8,y0+8,w-16,d-16,'ln');
  case 'dining': case 'dining4': {const n=Math.max(1,Math.round(w/62));for(let i=0;i<n;i++){const cx=x0+w*(i+.5)/n;o+=R(cx-20,y0-26,40,34,'fu',4)+R(cx-20,y0-28,40,7,'fu2',2)+R(cx-20,y1-8,40,34,'fu',4)+R(cx-20,y1+19,40,7,'fu2',2);}if(w>=150){o+=R(x0-26,-20,34,40,'fu',4)+R(x0-28,-20,7,40,'fu2',2)+R(x1-8,-20,34,40,'fu',4)+R(x1+21,-20,7,40,'fu2',2);}return o+R(x0,y0,w,d,'fu',2);}
  case 'round': {const r=w/2;for(const a of [0,90,180,270]){const rad=a*Math.PI/180,cx=Math.sin(rad)*(r+6),cy=-Math.cos(rad)*(r+6);o+=`<g transform="translate(${f1(cx)} ${f1(cy)}) rotate(${a})">${R(-20,-18,40,34,'fu',4)+R(-20,-20,40,7,'fu2',2)}</g>`;}return o+C(0,0,r);}
  case 'chair': return R(x0,y0,w,d,'fu',4)+R(x0,y0,w,7,'fu2',2);
  case 'bed2': case 'bed1': {o=R(x0,y0,w,d,'fu',2)+R(x0,y0,w,8,'fu2');const n=t==='bed2'?2:1,pw=(w-12-(n-1)*6)/n;for(let i=0;i<n;i++)o+=R(x0+6+i*(pw+6),y0+13,pw,Math.min(42,d*.2),'fu',8);const yb=y0+d*.34;return o+L(x0,yb,x1,yb)+`<path d="M${x0} ${f1(yb+d*.1)}L${f1(x0+w*.22)} ${f1(yb)}" class="ln"/>`;}
  case 'night': return R(x0,y0,w,d)+C(0,0,m*.24,'ln');
  case 'wardrobe': {o=R(x0,y0,w,d)+L(x0+3,0,x1-3,0);for(let x=x0+10;x<x1-5;x+=13)o+=L(x-3,-d*.28,x+3,d*.28);return o;}
  case 'desk': return R(-21,y1+4,42,38,'fu',4)+R(-21,y1+36,42,7,'fu2',2)+R(x0,y0,w,d);
  case 'dresser': return R(x0,y0,w,d)+L(x0,y1-4,x1,y1-4)+L(0,y0,0,y1-4);
  case 'wc': return R(x0,y0,w,18,'fu',3)+E(0,y0+18+(d-18)/2,w/2-1,(d-18)/2)+E(0,y0+18+(d-18)/2+2,w/2-7,(d-18)/2-7,'ln');
  case 'basin': return R(x0,y0,w,d,'fu',4)+E(0,3,w*.32,d*.28,'ln')+C(0,y0+6,2.2,'ln');
  case 'bath': return R(x0,y0,w,d,'fu',8)+R(x0+7,y0+7,w-14,d-14,'ln',Math.min(24,d/2-8))+C(x0+w*.18,0,3,'ln');
  case 'shower': return R(x0,y0,w,d)+L(x0,y0,x1,y1)+L(x1,y0,x0,y1)+C(0,0,4,'fu');
  case 'bidet': return E(0,0,w/2,d/2)+E(0,2,w/2-6,d/2-8,'ln')+C(0,y0+8,2,'ln');
  case 'washer': return R(x0,y0,w,d)+C(0,0,m*.36,'ln')+C(0,0,m*.24,'ln');
  case 'plant': {o=C(0,0,w/2);for(let a=0;a<360;a+=45){const r=a*Math.PI/180;o+=L(0,0,Math.cos(r)*w*.45,Math.sin(r)*w*.45);}return o+C(0,0,w*.12,'fu2');}
  case 'stairs': {o=R(x0,y0,w,d);for(let y=y0+28;y<y1-2;y+=28)o+=L(x0,y,x1,y);return o+L(0,y1-10,0,y0+16)+`<path d="M-7 ${y0+28}L0 ${y0+14}L7 ${y0+28}" class="ln"/>`;}
  case 'wp_cold': return C(0,0,w/2,'wpc')+`<text x="0" y="${f1(w*.14)}" font-size="${f1(w*.4)}" text-anchor="middle" class="wpt" fill="#1f6fd1">AF</text>`;
  case 'wp_hot': return C(0,0,w/2,'wph')+`<text x="0" y="${f1(w*.14)}" font-size="${f1(w*.4)}" text-anchor="middle" class="wpt" fill="#c8321e">AC</text>`;
  case 'wp_drain': return C(0,0,w/2,'wpd')+C(0,0,w*.22,'wpd')+`<line x1="${f1(-w*.3)}" y1="0" x2="${f1(w*.3)}" y2="0" class="ln"/>`;
  case 'column': return R(x0,y0,w,d,'ink');
 }
 return R(x0,y0,w,d);
}

/* ================= state ================= */
const LS='axr-planta-'+(new URLSearchParams(location.search).get('home')||'x'),LSBG='planta-libre-bg-v1',LSSET='planta-libre-set-v1';
let S=null,BG=null,hist=[],redoS=[];
let sel=null,tool='select',placing=null,tab='props';
let view={x:-120,y:-120,k:.8},vw=800,vh=600;
let settings={grid:true,snap:true,ortho:true,dims:true,dimsInt:false,magnet:true,wallTh:10};
let draw=null,meas=null,calib=null,cursor=null,drag=null,lenBuf='';
const pointers=new Map();let pinch=null;
function blank(name){return {v:1,name:name||'Plano sin título',nodes:{},walls:{},openings:{},rooms:{},furn:{}};}
function snapshot(){hist.push(JSON.stringify(S));if(hist.length>80)hist.shift();redoS=[];if(S.example){S.example=false;$('#exChip').hidden=true;}}
function undo(){if(!hist.length)return toast('No hay nada que deshacer');redoS.push(JSON.stringify(S));S=JSON.parse(hist.pop());sel=null;changed();}
function redo(){if(!redoS.length)return toast('No hay nada que rehacer');hist.push(JSON.stringify(S));S=JSON.parse(redoS.pop());sel=null;changed();}
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LS,JSON.stringify(S));localStorage.setItem(LSSET,JSON.stringify(settings));}catch(e){}},500);}
function saveBG(){try{if(BG)localStorage.setItem(LSBG,JSON.stringify(BG));else localStorage.removeItem(LSBG);}catch(e){toast('El calco es demasiado grande para guardarse en este navegador; se mantendrá mientras la página esté abierta.');}}
function changed(props=true){render();if(props)renderPanel();save();$('#pname').value=S.name;if(window.updCost)updCost();}

/* ================= geometry ================= */
function G(id){const w=S.walls[id],a=S.nodes[w.a],b=S.nodes[w.b];const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1e-9;return {w,a,b,L,ux:dx/L,uy:dy/L,nx:-dy/L,ny:dx/L};}
function proj(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy||1e-9;const t=((p.x-a.x)*dx+(p.y-a.y)*dy)/L2;const tc=clamp(t,0,1);const x=a.x+dx*tc,y=a.y+dy*tc;return {t,tc,x,y,d:Math.hypot(p.x-x,p.y-y)};}
function wallsAt(n){return Object.keys(S.walls).filter(id=>S.walls[id].a===n||S.walls[id].b===n);}
function nodeLockedWalls(n){return wallsAt(n).filter(id=>S.walls[id].locked);}
function findNode(x,y,tol=.6){for(const id in S.nodes){const n=S.nodes[id];if(Math.hypot(n.x-x,n.y-y)<=tol)return id;}return null;}
function nodeAt(x,y,tol=.6){const f=findNode(x,y,tol);if(f)return f;const id=uid('n');S.nodes[id]={x:f1(x),y:f1(y)};return id;}
function addWall(a,b,th,locked){if(a===b)return null;for(const id in S.walls){const w=S.walls[id];if((w.a===a&&w.b===b)||(w.a===b&&w.b===a))return id;}const id=uid('w');S.walls[id]={a,b,th:th||10,locked:!!locked};return id;}
function sArea(P){let s=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];s+=a.x*b.y-b.x*a.y;}return s/2;}
function inPoly(p,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if(((a.y>p.y)!==(b.y>p.y))&&(p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x))c=!c;}return c;}
function labelPt(P){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;P.forEach(p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);});let best=null,bd=-1;const N=12;for(let i=0;i<=N;i++)for(let j=0;j<=N;j++){const p={x:x0+(x1-x0)*(i+.5)/(N+1),y:y0+(y1-y0)*(j+.5)/(N+1)};if(!inPoly(p,P))continue;let d=1e9;for(let k=0;k<P.length;k++)d=Math.min(d,proj(p,P[k],P[(k+1)%P.length]).d);if(d>bd){bd=d;best=p;}}return best||{x:(x0+x1)/2,y:(y0+y1)/2};}
function freeNodes(){const s=new Set();for(const id in S.walls){const w=S.walls[id];if(w.free){s.add(w.a);s.add(w.b);}}return s;}
function replaceNode(from,to){for(const id in S.walls){const w=S.walls[id];if(w.a===from)w.a=to;if(w.b===from)w.b=to;if(w.a===w.b)delete S.walls[id];}
 const seen={};for(const id in S.walls){const w=S.walls[id];const k=[w.a,w.b].sort().join('|');if(seen[k]){if(w.locked)S.walls[seen[k]].locked=true;delete S.walls[id];}else seen[k]=id;}
 for(const r of Object.values(S.rooms))r.nodes=r.nodes.map(n=>n===from?to:n);delete S.nodes[from];}
function mergeNodes(tol){const ids=Object.keys(S.nodes),free=freeNodes();for(let i=0;i<ids.length;i++){const A=ids[i];if(!S.nodes[A]||free.has(A))continue;for(let j=i+1;j<ids.length;j++){const B=ids[j];if(!S.nodes[B]||free.has(B))continue;const a=S.nodes[A],b=S.nodes[B];if(Math.hypot(a.x-b.x,a.y-b.y)<=tol){if(nodeLockedWalls(B).length&&!nodeLockedWalls(A).length){a.x=b.x;a.y=b.y;}replaceNode(B,A);}}}}
function splitAtNodes(tol){const free=freeNodes();let again=true,g=0;while(again&&g++<800){again=false;outer:for(const nid in S.nodes){if(free.has(nid))continue;const p=S.nodes[nid];for(const wid in S.walls){const w=S.walls[wid];if(w.a===nid||w.b===nid||w.free)continue;const gg=G(wid);const pr=proj(p,gg.a,gg.b);if(pr.d<=tol&&pr.t*gg.L>tol&&(1-pr.t)*gg.L>tol){if(pr.d>.01&&!nodeLockedWalls(nid).length){p.x=f1(pr.x);p.y=f1(pr.y);}const w2=uid('w');S.walls[w2]={...w,a:nid,b:w.b};w.b=nid;for(const r of Object.values(S.rooms)){const N=r.nodes;for(let i=0;i<N.length;i++){const u=N[i],v=N[(i+1)%N.length];if((u===w.a&&v===S.walls[w2].b)||(v===w.a&&u===S.walls[w2].b)){N.splice(i+1,0,nid);break;}}}again=true;break outer;}}}}}
function healAll(){let again=true,g=0;while(again&&g++<800){again=false;for(const nid in S.nodes){const ws=wallsAt(nid);if(ws.length!==2)continue;const w1=S.walls[ws[0]],w2=S.walls[ws[1]];if(w1.th!==w2.th||!!w1.locked!==!!w2.locked||w1.free||w2.free)continue;const g1=G(ws[0]),g2=G(ws[1]);if(Math.abs(g1.ux*g2.uy-g1.uy*g2.ux)>.002)continue;const o1=w1.a===nid?w1.b:w1.a,o2=w2.a===nid?w2.b:w2.a;const n=S.nodes[nid],p1=S.nodes[o1],p2=S.nodes[o2];if((p1.x-n.x)*(p2.x-n.x)+(p1.y-n.y)*(p2.y-n.y)>0)continue;w1.a=o1;w1.b=o2;delete S.walls[ws[1]];delete S.nodes[nid];for(const r of Object.values(S.rooms))r.nodes=r.nodes.filter(x=>x!==nid);again=true;break;}}}
function cleanupNodes(){const used=new Set();for(const w of Object.values(S.walls)){used.add(w.a);used.add(w.b);}for(const id in S.nodes)if(!used.has(id))delete S.nodes[id];}
function openingCenter(o){const g=G(o.wall);return {x:g.a.x+g.ux*o.t*g.L,y:g.a.y+g.uy*o.t*g.L};}
function withOpenings(fn){const cen={};for(const id in S.openings){const o=S.openings[id];if(S.walls[o.wall])cen[id]=openingCenter(o);}fn();
 for(const id in S.openings){const o=S.openings[id],c=cen[id];if(!c){delete S.openings[id];continue;}let ok=false;if(S.walls[o.wall]){const g=G(o.wall);const pr=proj(c,g.a,g.b);if(pr.d<1&&pr.t>=0&&pr.t<=1){o.t=pr.t;ok=true;}}
  if(!ok){let best=null,bd=3;for(const wid in S.walls){const g=G(wid);const pr=proj(c,g.a,g.b);if(pr.d<bd&&pr.t>0&&pr.t<1){bd=pr.d;best={wid,t:pr.t};}}if(best){o.wall=best.wid;o.t=best.t;}else delete S.openings[id];}}}
function normalize(tol=.6){withOpenings(()=>{mergeNodes(tol);splitAtNodes(tol);healAll();cleanupNodes();});syncRooms();}

/* rooms = inner faces of the wall graph */
function innerFaces(){const adj={};const add=(u,v)=>{(adj[u]=adj[u]||[]);if(!adj[u].includes(v))adj[u].push(v);};
 for(const w of Object.values(S.walls)){add(w.a,w.b);add(w.b,w.a);}
 for(const u in adj){const p=S.nodes[u];adj[u].sort((m,n)=>Math.atan2(S.nodes[m].y-p.y,S.nodes[m].x-p.x)-Math.atan2(S.nodes[n].y-p.y,S.nodes[n].x-p.x));}
 const seen=new Set(),F=[];
 for(const u in adj)for(const v of adj[u]){if(seen.has(u+'>'+v))continue;const face=[];let a=u,b=v,g=0;while(g++<4000){seen.add(a+'>'+b);face.push(a);const nb=adj[b];const i=nb.indexOf(a);const c=nb[(i-1+nb.length)%nb.length];a=b;b=c;if(a===u&&b===v)break;}F.push({nodes:face,area:sArea(face.map(n=>S.nodes[n]))});}
 if(!F.length)return [];const big=F.reduce((m,f)=>Math.abs(f.area)>Math.abs(m.area)?f:m);const os=Math.sign(big.area);
 return F.filter(f=>Math.sign(f.area)===-os&&Math.abs(f.area)>3000);}
function outerArea(){let best=0;
 const adj={};const add=(u,v)=>{(adj[u]=adj[u]||[]);if(!adj[u].includes(v))adj[u].push(v);};for(const w of Object.values(S.walls)){add(w.a,w.b);add(w.b,w.a);}
 for(const u in adj){const p=S.nodes[u];adj[u].sort((m,n)=>Math.atan2(S.nodes[m].y-p.y,S.nodes[m].x-p.x)-Math.atan2(S.nodes[n].y-p.y,S.nodes[n].x-p.x));}
 const seen=new Set();for(const u in adj)for(const v of adj[u]){if(seen.has(u+'>'+v))continue;const face=[];let a=u,b=v,g=0;while(g++<4000){seen.add(a+'>'+b);face.push(S.nodes[a]);const nb=adj[b];const i=nb.indexOf(a);const c=nb[(i-1+nb.length)%nb.length];a=b;b=c;if(a===u&&b===v)break;}best=Math.max(best,Math.abs(sArea(face)));}
 return best;}
const fkey=ns=>[...ns].sort().join(',');
function syncRooms(){const F=innerFaces(),old=Object.entries(S.rooms),next={},used=new Set();const byKey={};old.forEach(([id,r])=>byKey[fkey(r.nodes)]=id);
 const rest=[];
 for(const f of F){const id=byKey[fkey(f.nodes)];if(id&&!used.has(id)){used.add(id);next[id]={...S.rooms[id],nodes:f.nodes};}else rest.push(f);}
 for(const f of rest){const P=f.nodes.map(n=>S.nodes[n]);const lp=labelPt(P);let name='Espacio',bestA=0,from=null;
  for(const [id,r] of old){if(!r.poly||r.poly.length<3)continue;const rp=r.poly.map(([x,y])=>({x,y}));const hit=inPoly(lp,rp)||inPoly(labelPt(rp),P);if(hit){const a=Math.abs(sArea(rp));if(a>bestA){bestA=a;name=r.name;from=id;}}}
  const nid=(from&&!used.has(from))?from:uid('r');used.add(nid);next[nid]={name,nodes:f.nodes};}
 for(const r of Object.values(next))r.poly=r.nodes.map(n=>[S.nodes[n].x,S.nodes[n].y]);
 S.rooms=next;if(sel&&sel.kind==='room'&&!S.rooms[sel.id])sel=null;}
function roomPts(r){return r.nodes.map(n=>S.nodes[n]).filter(Boolean);}
function wallBetween(u,v){for(const w of Object.values(S.walls))if((w.a===u&&w.b===v)||(w.a===v&&w.b===u))return w;return null;}
function roomNet(r){const P=roomPts(r);let A=Math.abs(sArea(P)),per=0;for(let i=0;i<r.nodes.length;i++){const u=r.nodes[i],v=r.nodes[(i+1)%r.nodes.length];const a=S.nodes[u],b=S.nodes[v];if(!a||!b)continue;const L=Math.hypot(b.x-a.x,b.y-a.y);const w=wallBetween(u,v);A-=L*(w?w.th/2:0);per+=L;}return {area:Math.max(0,A),per};}
function plateCentroid(){let x=0,y=0,n=0;for(const p of Object.values(S.nodes)){x+=p.x;y+=p.y;n++;}return n?{x:x/n,y:y/n}:{x:0,y:0};}

/* ================= openings & furniture helpers ================= */
function nearestWall(p,tol){let best=null,bd=tol;for(const wid in S.walls){const g=G(wid);const pr=proj(p,g.a,g.b);if(pr.d<bd&&pr.t>0&&pr.t<1){bd=pr.d;best={wid,t:pr.t,g,pr};}}return best;}
function addOpeningAt(x,y,w,kind,toward){const nw=nearestWall({x,y},60);if(!nw)return null;const g=nw.g;w=Math.min(w,g.L-10);if(w<20)return null;const half=w/2/g.L;const t=clamp(nw.t,half+.01,1-half-.01);const id=uid('o');let flip=0;if(toward){const c={x:g.a.x+g.ux*t*g.L,y:g.a.y+g.uy*t*g.L};if((toward.x-c.x)*g.nx+(toward.y-c.y)*g.ny<0)flip|=2;}S.openings[id]={wall:nw.wid,t,w,kind:kind||'door',flip};return id;}
function addFurn(type,x,y,rot,w,d,label){const T=TYPES[type];if(!T)return null;const id=uid('f');S.furn[id]={type,x:f1(x),y:f1(y),rot:normDeg(rot||0),w:w||T.w,d:d||T.d,label:label||''};return id;}
function furnExtentAlong(f,nx,ny){const r=f.rot*Math.PI/180;const ux=Math.cos(r),uy=Math.sin(r),vx=-Math.sin(r),vy=Math.cos(r);return Math.abs(f.w/2*(ux*nx+uy*ny))+Math.abs(f.d/2*(vx*nx+vy*ny));}
function magnet(f){if(!settings.magnet)return;
 let best=null;for(const wid in S.walls){const g=G(wid);const pr=proj(f,g.a,g.b);if(pr.t<-.02||pr.t>1.02)continue;const side=Math.sign((f.x-pr.x)*g.nx+(f.y-pr.y)*g.ny)||1;const ext=furnExtentAlong(f,g.nx,g.ny);const gap=pr.d-g.w.th/2-ext;if(gap<28&&gap>-ext&&(!best||Math.abs(gap)<Math.abs(best.gap)))best={g,pr,side,gap,wid};}
 if(best){const {g,side}=best;const bx=-side*g.nx,by=-side*g.ny;const r0=Math.atan2(bx,-by)*180/Math.PI;const diff=((f.rot-r0)%360+540)%360-180;const q=Math.round(diff/90)*90;f.rot=normDeg(r0+q);const ext=furnExtentAlong(f,g.nx,g.ny);const pr=proj(f,g.a,g.b);f.x=f1(pr.x+side*g.nx*(g.w.th/2+ext));f.y=f1(pr.y+side*g.ny*(g.w.th/2+ext));
  // second, perpendicular wall (corners)
  for(const wid in S.walls){if(wid===best.wid)continue;const g2=G(wid);if(Math.abs(g2.ux*g.ux+g2.uy*g.uy)>.1)continue;const pr2=proj(f,g2.a,g2.b);if(pr2.t<-.02||pr2.t>1.02)continue;const s2=Math.sign((f.x-pr2.x)*g2.nx+(f.y-pr2.y)*g2.ny)||1;const e2=furnExtentAlong(f,g2.nx,g2.ny);const gap2=pr2.d-g2.w.th/2-e2;if(gap2<18&&gap2>-e2){f.x=f1(f.x-s2*g2.nx*gap2);f.y=f1(f.y-s2*g2.ny*gap2);break;}}}
 // abut neighbours with the same orientation (kitchen runs)
 const r=f.rot*Math.PI/180,ux=Math.cos(r),uy=Math.sin(r),vx=-uy,vy=ux;
 for(const [id,o] of Object.entries(S.furn)){if(o===f||normDeg(o.rot)!==normDeg(f.rot))continue;const dx=o.x-f.x,dy=o.y-f.y;const along=dx*ux+dy*uy,across=dx*vx+dy*vy;if(Math.abs(across)>12)continue;const need=(o.w+f.w)/2;const gap=Math.abs(along)-need;if(gap>-12&&gap<14){const s=Math.sign(along)||1;f.x=f1(o.x-s*need*ux-across*vx*(Math.abs(across)<12?1:0));f.y=f1(o.y-s*need*uy-across*vy*(Math.abs(across)<12?1:0));break;}}}

/* ================= wall moves with linked walls ================= */
function planEnd(nid,ex,n){const others=wallsAt(nid).filter(x=>!ex.has(x));const dir=id=>{const g=G(id);return [g.ux,g.uy];};const dot=u=>u[0]*n[0]+u[1]*n[1];
 const locked=others.filter(o=>S.walls[o].locked).map(dir);
 if(locked.length){const u0=locked[0];if(locked.some(u=>Math.abs(u[0]*u0[1]-u[1]*u0[0])>.05))return {fixed:true};if(Math.abs(dot(u0))<.2)return {fixed:true};return {u:u0};}
 const cand=others.map(dir).filter(u=>Math.abs(dot(u))>.2).sort((a,b)=>Math.abs(dot(b))-Math.abs(dot(a)));return cand.length?{u:cand[0]}:{u:null};}
function wallChain(id){const g0=G(id);const chain=new Set([id]);const stack=[S.walls[id].a,S.walls[id].b],seen=new Set();
 while(stack.length){const n=stack.pop();if(seen.has(n))continue;seen.add(n);for(const wid of wallsAt(n)){if(chain.has(wid))continue;const w=S.walls[wid];if(w.locked||w.free)continue;const g=G(wid);if(Math.abs(g.ux*g0.uy-g.uy*g0.ux)>.01)continue;const on=w.a===n?w.b:w.a,p=S.nodes[on];if(Math.abs((p.x-g0.a.x)*g0.nx+(p.y-g0.a.y)*g0.ny)<1){chain.add(wid);stack.push(on);}}}
 return [...chain];}
function moveWallBody(st,d){const {n}=st;for(const e of st.ends){const p=S.nodes[e.nid];if(e.plan.u){const s=d/(e.plan.u[0]*n[0]+e.plan.u[1]*n[1]);p.x=f1(e.ox+e.plan.u[0]*s);p.y=f1(e.oy+e.plan.u[1]*s);}else{p.x=f1(e.ox+n[0]*d);p.y=f1(e.oy+n[1]*d);}}}

const P2=p=>`${f1(p.x)} ${f1(p.y)}`;
const line=(a,b,c,extra='')=>`<line x1="${f1(a.x)}" y1="${f1(a.y)}" x2="${f1(b.x)}" y2="${f1(b.y)}" class="${c}" ${extra}/>`;
const isSel=(k,id)=>sel&&sel.kind===k&&sel.id===id;

function drawPlan(k,mode){const px=1/k,scr=mode==='screen';let o='';
 if(scr&&BG&&BG.show)o+=`<image href="${BG.src}" x="${BG.x}" y="${BG.y}" width="${BG.w*BG.s}" height="${BG.h*BG.s}" opacity="${BG.op}" preserveAspectRatio="none" style="pointer-events:none"/>`;
 const rooms=Object.entries(S.rooms).map(([id,r])=>({id,r,P:roomPts(r)})).filter(x=>x.P.length>2);
 for(const R of rooms)o+=`<path d="M${R.P.map(P2).join('L')}Z" class="rm${scr&&isSel('room',R.id)?' on':''}" ${scr?`data-k="room" data-id="${R.id}"`:''}/>`;
 const deg={};for(const w of Object.values(S.walls)){deg[w.a]=(deg[w.a]||0)+1;deg[w.b]=(deg[w.b]||0)+1;}
 const segs=Object.keys(S.walls).map(id=>{const g=G(id),w=g.w;const ea=deg[w.a]>1?w.th/2:0,eb=deg[w.b]>1?w.th/2:0;return {id,w,g,p1:{x:g.a.x-g.ux*ea,y:g.a.y-g.uy*ea},p2:{x:g.b.x+g.ux*eb,y:g.b.y+g.uy*eb}};});

 if(scr){const sw=sel&&sel.kind==='wall'&&S.walls[sel.id]?segs.find(s=>s.id===sel.id):null;if(sw)o+=line(sw.p1,sw.p2,'selw',`stroke-width="${sw.w.th+8*px}"`);

 for(const [id,op] of Object.entries(S.openings)){if(S.walls[op.wall])o+=drawOpening(id,op,px,scr);}

 o+=Object.keys(S.walls).filter(id=>S.walls[id].locked?(settings.dims||!scr):(settings.dimsInt&&(scr||settings.dims))).map(id=>dimFor(id,px,false)).join('');
 const fs=11*px;
 for(const R of rooms){const lp=labelPt(R.P);const na=roomNet(R.r).area;if(na<5000&&scr&&k<.4)continue;o+=`<text x="${f1(lp.x)}" y="${f1(lp.y-fs*.15)}" font-size="${f1(fs*1.2)}" font-weight="600" text-anchor="middle" class="tx" style="pointer-events:none">${esc(R.r.name)}</text><text x="${f1(lp.x)}" y="${f1(lp.y+fs*1.15)}" font-size="${f1(fs*.95)}" text-anchor="middle" class="tm" style="pointer-events:none">${fmtA(na)} m²</text>`;}

const OK={door:{n:'Puerta abatible',s:'Puerta',w:82},double:{n:'Puerta doble',s:'Puerta doble',w:145},sliding:{n:'Corredera vista',s:'Corredera',w:82},pocket:{n:'Corredera empotrada',s:'Corredera empotrada',w:82},window:{n:'Ventana',s:'Ventana',w:120},wslide:{n:'Ventana corredera',s:'Ventana corredera',w:150},balcony:{n:'Balconera',s:'Balconera',w:140},balslide:{n:'Balconera corredera',s:'Balconera corredera',w:200},opening:{n:'Hueco de paso',s:'Hueco de paso',w:90}};

function drawOpening(id,op,px,scr){const g=G(op.wall);const c={x:g.a.x+g.ux*op.t*g.L,y:g.a.y+g.uy*op.t*g.L};return openingSvg({ux:g.ux,uy:g.uy,nx:g.nx,ny:g.ny,th:g.w.th},c,op,px,scr?id:null);}
function openingSvg(g,c,op,px,id){const th=g.th,hw=op.w/2,W=op.w;const hs=(op.flip&1)?1:-1,sw=(op.flip&2)?-1:1;
 const P=(s,t)=>({x:c.x+g.ux*s+g.nx*t,y:c.y+g.uy*s+g.ny*t});const ht=th/2+1.4*px;
 const quad=(a,b,cl,ex='')=>`<path d="M${P2(P(-a,-b))}L${P2(P(a,-b))}L${P2(P(a,b))}L${P2(P(-a,b))}Z" class="${cl}" ${ex}/>`;
 const leaf=(hS,len,toS)=>{const hinge=P(hS,sw*th/2),open=P(hS,sw*(th/2+len)),closed=P(toS,sw*th/2);const v1={x:open.x-hinge.x,y:open.y-hinge.y},v2={x:closed.x-hinge.x,y:closed.y-hinge.y};const sweep=(v1.x*v2.y-v1.y*v2.x)>0?1:0;return line(hinge,open,'lnb')+`<path d="M${P2(open)}A${f1(len)} ${f1(len)} 0 0 ${sweep} ${P2(closed)}" class="arc"/>`;};
 const rect4=(s0,s1,t0,t1,cl)=>`<path d="M${P2(P(s0,t0))}L${P2(P(s1,t0))}L${P2(P(s1,t1))}L${P2(P(s0,t1))}Z" class="${cl}"/>`;

function opThumb(k){const w=OK[k].w,th=16;const long=k==='sliding'||k==='pocket';const L=long?w*2.4:w+60;const ext=k==='door'?w:(k==='double'||k==='balcony')?w/2:16;const op={w,kind:k,flip:2|(long?1:0)};const cx=long?-w*.6:0;

function snapPt(p,from,free,excludeNode){const tol=10/view.k;let best=null,bd=tol;

 let x=p.x,y=p.y,axis=null;
 if(from&&settings.ortho&&!free){const dx=x-from.x,dy=y-from.y;if(Math.abs(dx)>=Math.abs(dy)){y=from.y;axis='h';}else{x=from.x;axis='v';}}
 for(const wid in S.walls){const w=S.walls[wid];if(excludeNode&&(w.a===excludeNode||w.b===excludeNode))continue;const g=G(wid);const pr=proj({x,y},g.a,g.b);if(pr.d<tol&&pr.t>0&&pr.t<1){
  if(!axis)return {x:pr.x,y:pr.y,wall:wid,snapKind:'wall'};

 return {x,y};}

 if(D.type==='rot'){const f=S.furn[D.id];if(!D.moved){snapshot();D.moved=true;}let a=Math.atan2(p.x-f.x,-(p.y-f.y))*180/Math.PI;if(!e.shiftKey)a=Math.round(a/15)*15;f.rot=normDeg(a);render();return;}
 if(D.type==='rsz'){const f=S.furn[D.id];if(!D.moved){snapshot();D.moved=true;}const r=-f.rot*Math.PI/180;const dx=p.x-f.x,dy=p.y-f.y;const lx=dx*Math.cos(r)-dy*Math.sin(r),ly=dx*Math.sin(r)+dy*Math.cos(r);let w=Math.max(10,Math.abs(lx)*2),d=Math.max(10,Math.abs(ly)*2);if(!e.shiftKey){w=Math.round(w/5)*5;d=Math.round(d/5)*5;}f.w=w;f.d=d;render();return;}
 if(D.type==='open'){const o=S.openings[D.id];if(o.fixed){if(!D.warned){D.warned=1;toast(TX.fixwin);}return;}const g=G(o.wall);const pr=proj(p,g.a,g.b);const half=o.w/2/g.L;let t=clamp(pr.t,half+.005,1-half-.005);if(settings.snap&&!e.shiftKey){t=Math.round(t*g.L/5)*5/g.L;t=clamp(t,half+.005,1-half-.005);}if(!D.moved){snapshot();D.moved=true;}o.t=t;render();return;}
 if(D.type==='wall'){const dd=(p.x-D.sx)*D.n[0]+(p.y-D.sy)*D.n[1];if(!D.moved&&Math.abs(dd)*view.k<3)return;
  if(D.locked){if(!D.warned){D.warned=1;toast('Pared principal bloqueada: no se puede mover');}return;}

 const existed=p.node&&S.nodes[p.node]&&p.node!==from.node;
 const a=(from.node&&S.nodes[from.node])?from.node:nodeAt(from.x,from.y);const b=(p.node&&S.nodes[p.node])?p.node:nodeAt(p.x,p.y);addWall(a,b,settings.wallTh,false);normalize();

/* ================= keyboard ================= */
document.addEventListener('keydown',e=>{const tg=e.target;if(tg.matches('input,textarea,select'))return;

 const mod=e.ctrlKey||e.metaKey;
 if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
 if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}
 if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();act('dup');return;}
 if(tool==='open'&&/^[0-9]$/.test(e.key)){lenBuf+=e.key;showLen(null);return;}
 if(tool==='open'&&e.key==='Backspace'&&lenBuf){lenBuf=lenBuf.slice(0,-1);showLen(null);return;}
 if(tool==='open'&&e.key==='Enter'&&lenBuf){const v=parseFloat(lenBuf);lenBuf='';$('#lenbox').hidden=true;if(v>=30&&v<=600){openW=v;toast(`Ancho del hueco: ${v} cm`);}else toast('El ancho debe estar entre 30 y 600 cm');render();return;}
 if(tool==='wall'&&draw&&/^[0-9.,]$/.test(e.key)){lenBuf+=e.key;showLen(null);return;}
 if(tool==='wall'&&draw&&e.key==='Backspace'&&lenBuf){lenBuf=lenBuf.slice(0,-1);showLen(null);return;}
 if(tool==='wall'&&draw&&e.key==='Enter'&&lenBuf){const L=parseFloat(lenBuf.replace(',','.'));const tgt=draw.preview||cursor;if(L>0&&tgt){let dx=tgt.x-draw.from.x,dy=tgt.y-draw.from.y;const m=Math.hypot(dx,dy)||1;if(m<1){dx=1;dy=0;}const p={x:draw.from.x+dx/m*L,y:draw.from.y+dy/m*L};commitWallSeg({x:f1(p.x),y:f1(p.y)});render();}return;}
 if(e.key==='Escape'){if(placing){placing=null;renderLib();}draw=null;meas=null;calib=null;lenBuf='';$('#lenbox').hidden=true;if(tool==='bgmove'||tool==='calib'||tool==='open')setTool('select');else if(tool==='select')sel=null;renderPanel();render();return;}
 if(e.key==='Delete'||e.key==='Backspace'){act('del');return;}
 const k=e.key.toLowerCase();
 if(k==='r'){if(placing){placingRot=normDeg(placingRot+90);render();}else if(tool==='open'){openFlip^=1;render();}else act('rot90');return;}
 const map={v:['select'],w:['wall'],d:['open','door'],c:['open','sliding'],n:['open','window'],b:['open','balcony'],m:['measure']};if(map[k]){setTool(...map[k]);return;}
 if(k==='f'){fit();return;}});

async function exportPDF(size){try{toast('Preparando el PDF…');await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');const {jsPDF}=window.jspdf;
 const pw=size==='a3'?420:297,ph=size==='a3'?297:210;const M=10,TB=24;const aw=pw-2*M,ah=ph-2*M-TB-4;const b=planBounds();
 const N=[20,25,50,75,100,125,150,200,250,300,400,500,750,1000].find(n=>b.w*10/n<=aw&&b.h*10/n<=ah)||1000;

 const pxPerMm=Math.min(8,4200/Math.max(aw,ah));const k=pxPerMm*mmPerCm;const svg=exportSvgString(k,box,false);const c=await svgToCanvas(svg,Math.round(aw*pxPerMm),Math.round(ah*pxPerMm));
 const doc=new jsPDF({orientation:'landscape',unit:'mm',format:size});doc.addImage(c.toDataURL('image/jpeg',.92),'JPEG',M,M,aw,ah);
 doc.setLineWidth(.5);doc.rect(M,M,aw,ph-2*M);doc.setLineWidth(.25);const ty=ph-M-TB;doc.line(M,ty,pw-M,ty);

 const sb=100*mmPerCm;let x=cols[1]+3,y=ty+18;const seg=[0,1,2];const step=sb<8?5:1;for(let i=0;i<3;i++){doc.setFillColor(i%2?255:17);doc.rect(x+i*sb*step,y,sb*step,1.6,i%2?'S':'F');}doc.setFontSize(6);doc.text('0',x,y+4.2);doc.text((3*step)+' m',x+3*sb*step,y+4.2,{align:'center'});
 const util=Object.values(S.rooms).reduce((s,r)=>s+roomNet(r).area,0);lab('SUPERFICIES',cols[2]+3,ty+5);val(fmtA(util)+' m² útiles',cols[2]+3,ty+12,10);val(fmtA(outerArea())+' m² construidos',cols[2]+3,ty+18,10);
 lab('FECHA',cols[3]+3,ty+5);val(new Date().toLocaleDateString('es-ES'),cols[3]+3,ty+13,11);lab('Medidas en metros. Superficies aproximadas.',cols[3]+3,ty+20);
 const blob=doc.output('blob');await saveFile(fname('pdf'),blob,'application/pdf',c.toDataURL('image/jpeg',.7));}catch(e){console.error(e);toast('No se pudo generar el PDF');}}
function exportDXF(){const out=['0','SECTION','2','ENTITIES'];const mm=v=>(v*10).toFixed(1);const Ln=(a,b,layer)=>out.push('0','LINE','8',layer,'10',mm(a.x),'20',mm(-a.y),'30','0','11',mm(b.x),'21',mm(-b.y),'31','0');
 for(const id in S.walls){const g=G(id),t=g.w.th/2;const cuts=Object.values(S.openings).filter(o=>o.wall===id).map(o=>[o.t*g.L-o.w/2,o.t*g.L+o.w/2]).sort((a,b)=>a[0]-b[0]);const spans=[];let s0=0;cuts.forEach(([a,b])=>{spans.push([s0,a]);s0=b;});spans.push([s0,g.L]);
  for(const side of [-1,1])spans.forEach(([a,b])=>{if(b-a<.5)return;Ln({x:g.a.x+g.ux*a+g.nx*t*side,y:g.a.y+g.uy*a+g.ny*t*side},{x:g.a.x+g.ux*b+g.nx*t*side,y:g.a.y+g.uy*b+g.ny*t*side},g.w.locked?'MUROS_PRINCIPALES':'TABIQUES');});
  cuts.forEach(([a,b])=>{for(const s of [a,b])Ln({x:g.a.x+g.ux*s-g.nx*t,y:g.a.y+g.uy*s-g.ny*t},{x:g.a.x+g.ux*s+g.nx*t,y:g.a.y+g.uy*s+g.ny*t},'HUECOS');});}
 const deg=a=>((a*180/Math.PI)%360+360)%360;
 for(const o of Object.values(S.openings)){if(!S.walls[o.wall])continue;const g=G(o.wall),c=openingCenter(o),k=okind(o.kind),th=g.w.th,hw=o.w/2;const hs=(o.flip&1)?1:-1,sw=(o.flip&2)?-1:1;const P=(s,t)=>({x:c.x+g.ux*s+g.nx*t,y:c.y+g.uy*s+g.ny*t});
  const leaf=(hS,len,toS)=>{const h=P(hS,sw*th/2),op=P(hS,sw*(th/2+len)),cl=P(toS,sw*th/2);Ln(h,op,'HUECOS');const a1=Math.atan2(-(op.y-h.y),op.x-h.x),a2=Math.atan2(-(cl.y-h.y),cl.x-h.x);let st=a1,en=a2;if(((a2-a1)*180/Math.PI+360)%360>180){st=a2;en=a1;}out.push('0','ARC','8','HUECOS','10',mm(h.x),'20',mm(-h.y),'30','0','40',mm(len),'50',deg(st).toFixed(2),'51',deg(en).toFixed(2));};
  if(k==='door')leaf(hs*hw,o.w,-hs*hw);else if(k==='double'||k==='balcony'){leaf(-hw,hw,0);leaf(hw,hw,0);}else if(k!=='opening')Ln(P(-hw,0),P(hw,0),'HUECOS');}
 for(const f of Object.values(S.furn)){const r=f.rot*Math.PI/180,cs=Math.cos(r),sn=Math.sin(r);const P=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>({x:f.x+a*f.w/2*cs-b*f.d/2*sn,y:f.y+a*f.w/2*sn+b*f.d/2*cs}));for(let i=0;i<4;i++)Ln(P[i],P[(i+1)%4],'MOBILIARIO');out.push('0','TEXT','8','MOBILIARIO','10',mm(f.x),'20',mm(-f.y),'30','0','40','60','1',(f.label||TYPES[f.type].name).replace(/[^\x20-\x7EÀ-ÿ]/g,''));}
 for(const r of Object.values(S.rooms)){const P=roomPts(r);if(P.length<3)continue;const lp=labelPt(P);out.push('0','TEXT','8','TEXTOS','10',mm(lp.x),'20',mm(-lp.y),'30','0','40','150','1',`${r.name} ${fmtA(roomNet(r).area)} m2`);}
 out.push('0','ENDSEC','0','EOF');saveFile(fname('dxf'),out.join('\n'),'application/dxf');}

const PDFW='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',PDFJ='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const isPdf=f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name);
async function pdfOpen(file){await loadScript(PDFW);await loadScript(PDFJ);const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=PDFW;return lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;}
async function canvasOut(c){const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));return {blob,dataUrl:c.toDataURL('image/jpeg',.8),w:c.width,h:c.height};}
async function pdfPage(pdf,n,maxPx){const page=await pdf.getPage(n);const v1=page.getViewport({scale:1});const sc=Math.min(maxPx/Math.max(v1.width,v1.height),5);const vp=page.getViewport({scale:sc});const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await page.render({canvasContext:x,viewport:vp}).promise;
 let items=[];try{const tc=await page.getTextContent();items=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>{const m=window.pdfjsLib.Util.transform(vp.transform,i.transform);return {t:i.str.trim(),x:m[4],y:m[5]};});}catch(e){}
 return {...await canvasOut(c),items};}
async function imgFile(file,maxPx){const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const sc=Math.min(1,maxPx/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return {...await canvasOut(c),items:[]};}finally{URL.revokeObjectURL(url);}}
function pageText(items){const it=items.slice().sort((a,b)=>a.y-b.y||a.x-b.x);const lines=[];for(const i of it){const l=lines[lines.length-1];if(l&&Math.abs(l.y-i.y)<6)l.t.push(i);else lines.push({y:i.y,t:[i]});}return lines.map(l=>l.t.sort((a,b)=>a.x-b.x).map(i=>i.t).join('  ')).join('\n');}
async function takeFile(file,slot){if(!file)return;if(!isPdf(file)&&!/^image\//.test(file.type))return toast('Usa un PDF o una imagen JPG o PNG');toast('Leyendo '+file.name+'…');
 try{if(slot==='plan'){if(isPdf(file)){const pdf=await pdfOpen(file);IMP.plan={name:file.name,pdf,pages:pdf.numPages,page:1,...await pdfPage(pdf,1,2400)};}else IMP.plan={name:file.name,pages:1,page:1,...await imgFile(file,2400)};}
  else{const imgs=[];let text='',pages=1;if(isPdf(file)){const pdf=await pdfOpen(file);pages=pdf.numPages;for(let i=1;i<=Math.min(pages,15);i++){if(i<=4){const pg=await pdfPage(pdf,i,2000);imgs.push(pg);text+=pageText(pg.items)+'\n\n';}else{const page=await pdf.getPage(i);const tc=await page.getTextContent();text+=tc.items.map(x=>x.str).join(' ')+'\n\n';}}}else imgs.push(await imgFile(file,2000));
   IMP.meas={name:file.name,pages,imgs,text:text.trim(),dataUrl:imgs[0].dataUrl};}
  setTab('ai');toast(slot==='plan'?'Plano del piso cargado':'Amidaments cargados');}
 catch(e){console.error(e);toast('No se pudo leer el archivo. Prueba con otro PDF o con una imagen JPG o PNG.');}}
async function planPage(d){const P=IMP.plan;if(!P?.pdf)return;const n=clamp(P.page+d,1,P.pages);if(n===P.page)return;Object.assign(P,await pdfPage(P.pdf,n,2400),{page:n});renderAI();}

 for(const o of P.open){const tw=o.length>4?{x:o[4]*k,y:o[5]*k}:null;addOpeningAt(o[0]*k,o[1]*k,o[2],o[3],tw);}

function segList(P){const out=[];for(const id in P.walls){const w=P.walls[id],a=P.nodes[w.a],b=P.nodes[w.b];if(!a||!b)continue;out.push({a,b,th:w.th,locked:!!w.locked});}return out;}
function covered(p,ux,uy,list){for(const s of list){const dx=s.b.x-s.a.x,dy=s.b.y-s.a.y,L=Math.hypot(dx,dy)||1;const vx=dx/L,vy=dy/L;if(Math.abs(vx*uy-vy*ux)>.12)continue;const t=((p.x-s.a.x)*vx+(p.y-s.a.y)*vy);if(t<-2||t>L+2)continue;const d=Math.abs((p.x-s.a.x)*-vy+(p.y-s.a.y)*vx);if(d<=Math.max(4,s.th/2+2))return true;}return false;}
function diffLen(from,to){let len=0;for(const s of from){if(s.locked)continue;const dx=s.b.x-s.a.x,dy=s.b.y-s.a.y,L=Math.hypot(dx,dy);if(L<1)continue;const ux=dx/L,uy=dy/L;const n=Math.max(1,Math.round(L/5)),st=L/n;for(let i=0;i<n;i++){const t=(i+.5)*st;if(!covered({x:s.a.x+ux*t,y:s.a.y+uy*t},ux,uy,to))len+=st;}}return len;}
const DOORK=new Set(['door','double','sliding','pocket','opening']);
function opList(P){const out=[];for(const o of Object.values(P.openings)){const w=P.walls[o.wall];if(!w)continue;const a=P.nodes[w.a],b=P.nodes[w.b];const L=Math.hypot(b.x-a.x,b.y-a.y)||1;out.push({x:a.x+(b.x-a.x)*o.t,y:a.y+(b.y-a.y)*o.t,c:DOORK.has(okind(o.kind))?'door':'win'});}return out;}
function newOps(cls){const base=opList(BASE).filter(o=>o.c===cls),used=new Set();let n=0;for(const o of opList(S).filter(o=>o.c===cls)){let hit=-1;base.forEach((b,i)=>{if(!used.has(i)&&Math.hypot(b.x-o.x,b.y-o.y)<45&&hit<0)hit=i;});if(hit>=0)used.add(hit);else n++;}return n;}
function kitchenChanged(){const K=P=>Object.values(P.furn).filter(f=>/^k_/.test(f.type));const a=K(BASE),b=K(S);if(a.length!==b.length)return true;const used=new Set();for(const f of b){const i=a.findIndex((g,j)=>!used.has(j)&&g.type===f.type&&Math.hypot(g.x-f.x,g.y-f.y)<10&&normDeg(g.rot)===normDeg(f.rot));if(i<0)return true;used.add(i);}return false;}
function costItems(){if(!BASE||!S)return [];const A=segList(BASE),B=segList(S);const items=[];

 if(d)items.push({k:'door',qty:d,unit:'u',price:PRICE.door,amount:d*PRICE.door});
 if(w)items.push({k:'win',qty:w,unit:'u',price:PRICE.win,amount:w*PRICE.win});
 for(const t of ['wp_cold','wp_hot','wp_drain']){const n=Object.values(S.furn).filter(f=>f.type===t).length;if(n)items.push({k:t,qty:n,unit:'u',price:PRICE.wp,amount:n*PRICE.wp});}
 const fc=(P,t)=>Object.values(P.furn).filter(f=>f.type===t).length;
 for(const [t,k] of [['wc','wc'],['shower','shower'],['bath','bath']]){const n=Math.max(0,fc(S,t)-fc(BASE,t));if(n)items.push({k,qty:n,unit:'u',price:PRICE[k],amount:n*PRICE[k]});}
 if(kitchenChanged())items.push({k:'kit',qty:1,unit:'u',price:PRICE.kit,amount:PRICE.kit});
 if(items.length)items.unshift({k:'base',qty:1,unit:'u',price:PRICE.base,amount:PRICE.base});
 return items.map(i=>({...i,label:TX[i.k]}));}
function qtyTxt(i){return i.unit==='m'?(i.qty.toLocaleString(LOC,{maximumFractionDigits:2})+' m × '+eurF(i.price)):(i.qty+' × '+eurF(i.price));}
function costHtml(){const it=costItems(),tot=it.reduce((s,i)=>s+i.amount,0);
 return `<div class="sec"><h4>${TX.sec}</h4>${it.length?`<div class="rlist">${it.map(i=>`<button type="button" tabindex="-1"><span>${esc(i.label)}<br><span class="m" style="font-size:11px">${qtyTxt(i)}</span></span><span class="m">${eurF(i.amount)}</span></button>`).join('')}<button type="button" tabindex="-1" style="font-weight:600"><span>${TX.total}</span><span>${eurF(tot)}</span></button></div>`:`<p class="note">${TX.none}</p>`}
 ${it.some(i=>i.k==='kit')?`<div class="lockbar"><span>${TX.kwarn}</span></div>`:''}
 <p class="note">${TX.prices}</p><p class="note">${TX.lock}</p><p class="note">${TX.furn}</p><div class="lockbar"><span>${TX.legal}</span></div></div>`;}
window.updCost=function(){const it=costItems(),tot=it.reduce((s,i)=>s+i.amount,0);const c=$('#costChip');if(c){c.textContent=TX.cost+': '+eurF(tot);c.hidden=false;}};

async function planPng(){const box=exportBox();const k=clamp(1400/Math.max(box.w,box.h),.3,3);const svg=exportSvgString(k,box,false);const c=await svgToCanvas(svg,Math.round(box.w*k),Math.round(box.h*k));return {src:c.toDataURL('image/jpeg',.82),w:c.width,h:c.height};}
async function applyToCfg(){const items=costItems();const total=items.reduce((s,i)=>s+i.amount,0);let png=null;try{png=await planPng();}catch(e){}
 const msg={type:'axr-plan',home:AX.home,items,total,kitchen:items.some(i=>i.k==='kit'),changed:items.length>0||JSON.stringify(S.furn)!==JSON.stringify(BASE.furn),png};
 try{(window.parent!==window?window.parent:window.opener)?.postMessage(msg,location.origin==='null'?'*':location.origin);}catch(e){}
 toast(TX.applied);}


/* ---------- obertures fixes (façana i pati) i patis ---------- */
function anchorFixed(P){P=P||S;if(!P)return;for(const o of Object.values(P.openings)){if(!o.fixed)continue;const c={x:o.fx,y:o.fy};let best=null,bd=4;
  for(const wid in P.walls){const w=P.walls[wid],a=P.nodes[w.a],b=P.nodes[w.b];if(!a||!b)continue;const pr=proj(c,a,b);const d=pr.d-(w.locked?1:0);if(d<bd&&pr.t>0&&pr.t<1){bd=d;best={wid,t:pr.t};}}
  if(best){o.wall=best.wid;o.t=best.t;}}}
function syncFixed(){/* plànols desats abans de la v2.4: recupera les obertures fixes de l'original */
 const fixed=Object.values(BASE.openings).filter(o=>o.fixed);
 for(const id in S.openings){const o=S.openings[id];if(o.fixed)continue;const w=S.walls[o.wall];if(!w)continue;const c=openingCenter(o);if(fixed.some(f=>Math.hypot(f.fx-c.x,f.fy-c.y)<45))delete S.openings[id];}
 for(const f of fixed){if(!Object.values(S.openings).some(o=>o.fixed&&Math.hypot(o.fx-f.fx,o.fy-f.fy)<1))S.openings[uid('o')]=JSON.parse(JSON.stringify(f));}
 anchorFixed();}
function patioRects(){const P=PLANS[AX.kind],k=P.s;return (P.patios||[]).map(r=>({x0:r[0]*k,y0:r[1]*k,x1:r[2]*k,y1:r[3]*k}));}
function patioSvg(k){const px=1/k;return patioRects().map(r=>{const w=r.x1-r.x0,h=r.y1-r.y0,cx=(r.x0+r.x1)/2,cy=(r.y0+r.y1)/2,fs=Math.min(13*px,w/9);
  return `<g style="pointer-events:none"><rect x="${f1(r.x0)}" y="${f1(r.y0)}" width="${f1(w)}" height="${f1(h)}" fill="#eceee9" stroke="#8b918a" stroke-width="${f1(1.2*px)}"/><path d="M${f1(r.x0)} ${f1(r.y0)}L${f1(r.x1)} ${f1(r.y1)}M${f1(r.x1)} ${f1(r.y0)}L${f1(r.x0)} ${f1(r.y1)}" stroke="#a9aea7" stroke-width="${f1(px)}" fill="none"/><rect x="${f1(cx-fs*4.6)}" y="${f1(cy-fs*.95)}" width="${f1(fs*9.2)}" height="${f1(fs*1.9)}" fill="#fff" opacity=".9"/><text x="${f1(cx)}" y="${f1(cy+fs*.35)}" font-size="${f1(fs)}" text-anchor="middle" fill="#5d625c" font-family="Inter,system-ui,sans-serif" letter-spacing=".04em">${esc(TX.patio.toUpperCase())}</text></g>`;}).join('');}
{const _dp=drawPlan;drawPlan=function(k,mode){anchorFixed();return patioSvg(k)+_dp(k,mode);};
 const _pb=planBounds;planBounds=function(){const b=_pb();const rs=patioRects();if(!rs.length||!S||!Object.keys(S.nodes).length)return b;let x0=b.x,y0=b.y,x1=b.x+b.w,y1=b.y+b.h;for(const r of rs){x0=Math.min(x0,r.x0-30);y0=Math.min(y0,r.y0-30);x1=Math.max(x1,r.x1+30);y1=Math.max(y1,r.y1+30);}return {x:x0,y:y0,w:x1-x0,h:y1-y0};};}

/* ---------- arrencada ---------- */
(function boot(){try{const s=localStorage.getItem(LSSET);if(s)Object.assign(settings,JSON.parse(s));}catch(e){}
 settings.dimsInt=true;
 BASE=buildPlan(AX.kind);
 let loaded=false;try{const s=localStorage.getItem(LS);if(s){const P=JSON.parse(s);if(P&&P.walls&&P.nodes&&P.ax===AX.kind){S=P;loaded=true;}}}catch(e){}
 if(!loaded){S=JSON.parse(JSON.stringify(BASE));}
 S.ax=AX.kind;BG=null;syncFixed();
 document.title=TX.title;$('#brandTxt').textContent=TX.title;$('#pname').value=S.name;$('#pname').hidden=true;
 $('#bApply').textContent=TX.apply;$('#bReset').textContent=TX.reset;
 $('#bApply').onclick=applyToCfg;
 $('#bReset').onclick=()=>confirmBox(TX.reset,TX.resetQ,TX.reset,()=>{snapshot();S=JSON.parse(JSON.stringify(BASE));S.ax=AX.kind;sel=null;changed();fit();});
 window.updCost();renderPanel();requestAnimationFrame(()=>{fit();});})();
